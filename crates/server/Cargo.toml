[package]
name = "server"
version = "0.1.45"
edition = "2024"
default-run = "server"

[lints.clippy]
uninlined-format-args = "allow"

[dependencies]
deployment = { path = "../deployment" , version = "0.1.45" }
executors = { path = "../executors" , version = "0.1.45" }
local-deployment = { path = "../local-deployment" , version = "0.1.45" }
utils = { path = "../utils" , version = "0.1.45" }
git = { path = "../git" , version = "0.1.45" }
git-host = { path = "../git-host" , version = "0.1.45" }
db = { path = "../db" , version = "0.1.45" }
services = { path = "../services" , version = "0.1.45" }
worktree-manager = { path = "../worktree-manager" , version = "0.1.45" }
workspace-manager = { path = "../workspace-manager" , version = "0.1.45" }
preview-proxy = { path = "../preview-proxy" , version = "0.1.45" }
tokio = { workspace = true }
shlex = "1.3.0"
tokio-util = { version = "0.7", features = ["io"] }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
sqlx = { version = "0.8.6", features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "sqlite", "sqlite-preupdate-hook", "chrono", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
ts-rs = { workspace = true }
tower-http = { workspace = true }
schemars = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
aws-lc-sys = { workspace = true }
aws-lc-rs = { workspace = true }
strip-ansi-escapes = "0.2.1"
thiserror = { workspace = true }
os_info = "3.12.0"
futures-util = "0.3"
http = "1"
base64 = "0.22"
mime_guess = "2.0"
rust-embed = "8.2"
url = "2.5"

[dev-dependencies]
tempfile = "3"

[features]
default = []
qa-mode = ["services/qa-mode", "executors/qa-mode"]
