[package]
name = "embeddings"
version = "0.1.45"
edition = "2024"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
db = { path = "../db", version = "0.1.45" }
git = { path = "../git", version = "0.1.45" }
futures = "0.3.31"
# Same version as sqlx's bundled SQLite, so sqlite-vec registers into it.
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
sqlite-vec = "=0.1.9"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "uuid", "migrate", "macros", "derive"] }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
ts-rs = { workspace = true }
url = "2.5"
uuid = { version = "1.0", features = ["v4", "serde"] }
tree-sitter = "=0.27.1"
tree-sitter-rust = "=0.24.2"
tree-sitter-typescript = "=0.23.2"
tree-sitter-javascript = "=0.25.0"
tree-sitter-python = "=0.25.0"
tree-sitter-go = "=0.25.0"
tree-sitter-java = "=0.23.5"
tree-sitter-c-sharp = "=0.23.5"
tree-sitter-c = "=0.24.2"
tree-sitter-cpp = "=0.23.4"

[dev-dependencies]
axum = { workspace = true }
rand = "0.9"
tempfile = "3"
